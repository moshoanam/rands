<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rands">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Rands</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#14161a; --muted:#6b7280; --line:#e5e7eb;
    --accent:#0f9d58; --accent-ink:#ffffff; --danger:#dc2626; --chip:#eef0f3;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#191c22; --text:#f2f3f5; --muted:#9aa1ad; --line:#2a2f38;
      --accent:#22c55e; --accent-ink:#06210f; --chip:#232831; --shadow:none; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    touch-action:manipulation}
  body{padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
  .month{display:flex;align-items:center;gap:6px}
  .month h1{font-size:22px;margin:0;min-width:170px;text-align:center;letter-spacing:-.01em}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
  .icon-btn:active{background:var(--chip)}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .total{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .meta{display:flex;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
  .meta b{color:var(--text);font-weight:600}
  .bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .bar.over>i{background:var(--danger)}
  .over-txt{color:var(--danger)!important}
  .cat-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:7px 0}
  .cat-row .e{font-size:20px;text-align:center}
  .cat-row .n{font-size:15px}
  .cat-row .a{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
  .mini{height:5px;border-radius:99px;background:var(--chip);margin-top:4px;overflow:hidden}
  .mini>i{display:block;height:100%;border-radius:99px}
  h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px;display:flex;justify-content:space-between}
  .list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .item{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
  .item:first-child{border-top:0}
  .item:active{background:var(--chip)}
  .item .b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
  .item .t{font-size:15px;font-weight:500}
  .item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .item .a{font-weight:600;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty div{font-size:40px;margin-bottom:6px}
  .fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;
    background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:300;box-shadow:0 8px 24px rgba(15,157,88,.35);display:grid;place-items:center}
  .fab:active{transform:scale(.95)}
  /* sheets */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:22px 22px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    max-height:92vh;overflow:auto;max-width:560px;margin:0 auto}
  .open .backdrop{opacity:1;pointer-events:auto}
  .sheet.show{transform:none}
  .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
  .sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sheet-h h3{margin:0;font-size:18px}
  .link{color:var(--accent);font-weight:600;padding:6px}
  .amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 14px}
  .amount span{font-size:30px;color:var(--muted);font-weight:600}
  .amount input{font-size:44px;font-weight:700;width:70%;text-align:left;border:0;background:none;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .chip{background:var(--chip);border-radius:14px;padding:10px 6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
  .chip .e{font-size:22px}
  .chip.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--chip))}
  .field{display:block;margin-bottom:12px}
  .field small{display:block;color:var(--muted);font-size:13px;margin:0 2px 4px}
  .field input{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;min-height:48px}
  .field input:focus{border-color:var(--accent)}
  .primary{width:100%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:15px;border-radius:14px;margin-top:4px}
  .primary:disabled{opacity:.4}
  .danger{width:100%;color:var(--danger);font-weight:600;padding:14px;margin-top:6px}
  .row-btn{width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
  .row-btn span{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin:18px 8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
    <div class="month"><h1 id="monthLabel"></h1></div>
    <button class="icon-btn" id="next" aria-label="Next month">›</button>
  </header>

  <section class="card" id="summary"></section>
  <section class="card" id="cats"></section>
  <div id="list"></div>

  <div style="display:flex;justify-content:center;margin-top:18px">
    <button class="link" id="openSettings">⚙︎ Budget, export &amp; backup</button>
  </div>
  <p class="hint" id="installHint" hidden>Tip: tap <b>Share</b> → <b>Add to Home Screen</b> to install Rands as an app.</p>
</div>

<button class="fab" id="add" aria-label="Add expense">+</button>

<div id="layer">
  <div class="backdrop" id="backdrop"></div>

  <!-- Add / edit -->
  <div class="sheet" id="entrySheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-h">
      <button class="link" data-close>Cancel</button>
      <h3 id="entryTitle">New expense</h3>
      <span style="width:60px"></span>
    </div>
    <div class="amount"><span>R</span><input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <label class="field"><small>Note</small><input id="note" placeholder="e.g. Woolies, Engen, Uber" maxlength="80"></label>
    <label class="field"><small>Date</small><input id="date" type="date"></label>
    <button class="primary" id="saveEntry">Save</button>
    <button class="danger" id="deleteEntry" hidden>Delete expense</button>
  </div>

  <!-- Settings -->
  <div class="sheet" id="settingsSheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-h">
      <span style="width:60px"></span>
      <h3>Settings</h3>
      <button class="link" data-close>Done</button>
    </div>
    <label class="field"><small>Monthly budget (R) — leave blank for none</small><input id="budget" inputmode="decimal" placeholder="e.g. 15000"></label>
    <button class="row-btn" id="exportCsv">Export this month (CSV) <span>›</span></button>
    <button class="row-btn" id="exportAll">Export everything (CSV) <span>›</span></button>
    <button class="row-btn" id="backup">Back up data (JSON) <span>›</span></button>
    <button class="row-btn" id="restoreBtn">Restore from backup <span>›</span></button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <button class="danger" id="wipe">Erase all data</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="dlg" style="position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:24px">
  <div style="background:var(--card);border-radius:18px;max-width:320px;width:100%;padding:20px;text-align:center">
    <p id="dlgMsg" style="margin:0 0 16px;font-size:16px"></p>
    <div style="display:flex;gap:10px">
      <button id="dlgNo" style="flex:1;padding:12px;border-radius:12px;background:var(--chip);font-weight:600">Cancel</button>
      <button id="dlgYes" style="flex:1;padding:12px;border-radius:12px;background:var(--danger);color:#fff;font-weight:700">OK</button>
    </div>
  </div>
</div>

<script>
const CATS=[
  {id:'groceries',label:'Groceries',emoji:'🛒',color:'#22c55e'},
  {id:'transport',label:'Transport',emoji:'⛽',color:'#3b82f6'},
  {id:'eating',label:'Eating out',emoji:'🍔',color:'#f97316'},
  {id:'bills',label:'Bills',emoji:'💡',color:'#eab308'},
  {id:'family',label:'Family',emoji:'👨‍👧',color:'#ec4899'},
  {id:'health',label:'Health',emoji:'💊',color:'#14b8a6'},
  {id:'shopping',label:'Shopping',emoji:'🛍️',color:'#a855f7'},
  {id:'fun',label:'Fun',emoji:'🎬',color:'#6366f1'},
  {id:'other',label:'Other',emoji:'📦',color:'#64748b'},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const KEY='rands.v1';
const $=id=>document.getElementById(id);

// ---------- storage ----------
let memCopy=null;
function load(){
  try{const s=localStorage.getItem(KEY); if(s){const d=JSON.parse(s); if(Array.isArray(d.expenses)) return d;}}catch(e){}
  return memCopy||{expenses:[],budget:0};
}
function persist(){
  memCopy=state;
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
let state=load();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

// ---------- helpers ----------
const fmt=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'});
const money=c=>fmt.format((c||0)/100);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const toCents=s=>{ if(s==null) return NaN; s=String(s).replace(/[\sR]/g,'').replace(',','.'); if(!/^\d*\.?\d{0,2}$/.test(s)||s===''||s==='.') return NaN; return Math.round(parseFloat(s)*100); };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function ask(msg,yes='OK'){return new Promise(res=>{const d=$('dlg');$('dlgMsg').textContent=msg;$('dlgYes').textContent=yes;d.style.display='flex';
  const done=v=>{d.style.display='none';res(v);};$('dlgYes').onclick=()=>done(true);$('dlgNo').onclick=()=>done(false);});}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

let view=new Date(); view.setDate(1);

// ---------- render ----------
function monthItems(d){
  const key=ym(d);
  return state.expenses.filter(e=>e.date.startsWith(key))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
}
function render(){
  $('monthLabel').textContent=view.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});
  const items=monthItems(view);
  const total=items.reduce((s,e)=>s+e.amount,0);

  // days elapsed for average
  const now=new Date(), daysInMonth=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let days=daysInMonth;
  if(ym(view)===ym(now)) days=now.getDate(); else if(view>now) days=0;
  const avg=days?Math.round(total/days):0;

  let html=`<div class="label">Spent</div><div class="total">${money(total)}</div>`;
  if(state.budget>0){
    const pct=Math.min(100,total/state.budget*100), over=total>state.budget, left=state.budget-total;
    html+=`<div class="bar ${over?'over':''}"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>Budget <b>${money(state.budget)}</b></span>
      <span class="${over?'over-txt':''}">${over?'Over by':'Left'} <b class="${over?'over-txt':''}">${money(Math.abs(left))}</b></span></div>`;
  }
  html+=`<div class="meta" style="margin-top:6px"><span><b>${items.length}</b> expense${items.length===1?'':'s'}</span>${days?`<span>Avg <b>${money(avg)}</b>/day</span>`:''}</div>`;
  $('summary').innerHTML=html;

  // categories
  const by={}; items.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const catCard=$('cats');
  if(!rows.length){catCard.hidden=true;}
  else{
    catCard.hidden=false;
    const max=rows[0][1];
    catCard.innerHTML=`<div class="label" style="margin-bottom:4px">By category</div>`+rows.map(([id,amt])=>{
      const c=CAT[id]||CAT.other;
      return `<div class="cat-row"><div class="e">${c.emoji}</div>
        <div><div class="n">${c.label} <span style="color:var(--muted);font-size:13px">· ${Math.round(amt/total*100)}%</span></div>
        <div class="mini"><i style="width:${amt/max*100}%;background:${c.color}"></i></div></div>
        <div class="a">${money(amt)}</div></div>`;}).join('');
  }

  // list grouped by day
  const list=$('list');
  if(!items.length){
    list.innerHTML=`<div class="empty"><div>🧾</div>No expenses this month.<br>Tap <b>+</b> to add one.</div>`;
    return;
  }
  const groups={}; items.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  list.innerHTML=Object.keys(groups).sort().reverse().map(day=>{
    const g=groups[day], dt=parseISO(day);
    const label=day===iso(new Date())?'Today':dt.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});
    return `<h2><span>${label}</span><span>${money(g.reduce((s,e)=>s+e.amount,0))}</span></h2>
      <div class="list">${g.map(e=>{const c=CAT[e.cat]||CAT.other;
        return `<button class="item" data-id="${e.id}">
          <div class="b" style="background:${c.color}22">${c.emoji}</div>
          <div><div class="t">${c.label}</div>${e.note?`<div class="s">${esc(e.note)}</div>`:''}</div>
          <div class="a">${money(e.amount)}</div></button>`;}).join('')}</div>`;
  }).join('');
}

// ---------- sheets ----------
let openSheet=null, editingId=null, selCat='groceries';
function show(sheet){openSheet=sheet;$('layer').classList.add('open');requestAnimationFrame(()=>sheet.classList.add('show'));}
function hide(){if(!openSheet)return;openSheet.classList.remove('show');$('layer').classList.remove('open');document.activeElement&&document.activeElement.blur();openSheet=null;}
$('backdrop').onclick=hide;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=hide);

function drawChips(){
  $('chips').innerHTML=CATS.map(c=>`<button class="chip ${c.id===selCat?'sel':''}" data-cat="${c.id}"><span class="e">${c.emoji}</span>${c.label}</button>`).join('');
}
$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;selCat=b.dataset.cat;drawChips();};

function openEntry(exp){
  editingId=exp?exp.id:null;
  $('entryTitle').textContent=exp?'Edit expense':'New expense';
  $('amt').value=exp?(exp.amount/100).toFixed(2):'';
  $('note').value=exp?exp.note||'':'';
  // default date: today if viewing current month, otherwise 1st of viewed month
  const def=ym(view)===ym(new Date())?iso(new Date()):iso(view);
  $('date').value=exp?exp.date:def;
  selCat=exp?exp.cat:(state.lastCat||'groceries');
  $('deleteEntry').hidden=!exp;
  drawChips(); validate();
  show($('entrySheet'));
  if(!exp) setTimeout(()=>$('amt').focus(),250);
}
function validate(){const c=toCents($('amt').value);$('saveEntry').disabled=!(c>0)||!$('date').value;}
$('amt').oninput=validate; $('date').oninput=validate;

$('saveEntry').onclick=()=>{
  const amount=toCents($('amt').value); if(!(amount>0)) return;
  const rec={amount,cat:selCat,note:$('note').value.trim(),date:$('date').value};
  if(editingId){Object.assign(state.expenses.find(e=>e.id===editingId),rec);toast('Updated');}
  else{state.expenses.push({id:uid(),created:Date.now(),...rec});toast('Saved '+money(amount));}
  state.lastCat=selCat;
  persist();
  const d=parseISO(rec.date); view=new Date(d.getFullYear(),d.getMonth(),1);
  hide(); render();
};
$('deleteEntry').onclick=async()=>{
  if(!await ask('Delete this expense?','Delete')) return;
  state.expenses=state.expenses.filter(e=>e.id!==editingId); persist(); hide(); render(); toast('Deleted');
};
$('list').onclick=e=>{const b=e.target.closest('.item');if(!b)return;openEntry(state.expenses.find(x=>x.id===b.dataset.id));};
$('add').onclick=()=>openEntry(null);
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};

// swipe left/right on the page to change month
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{if(openSheet)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null||openSheet)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<40){(dx<0?$('next'):$('prev')).click();}},{passive:true});

// ---------- settings ----------
$('openSettings').onclick=()=>{$('budget').value=state.budget?(state.budget/100).toFixed(0):'';show($('settingsSheet'));};
$('budget').onchange=()=>{const v=$('budget').value.trim();const c=v?toCents(v):0;if(v&&!(c>=0)){toast('Invalid amount');return;}state.budget=c||0;persist();render();toast(c?'Budget set':'Budget removed');};

async function deliver(filename,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function toCsv(items){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  return 'Date,Category,Amount (ZAR),Note\n'+items.slice().sort((a,b)=>a.date.localeCompare(b.date))
    .map(e=>[e.date,q((CAT[e.cat]||CAT.other).label),(e.amount/100).toFixed(2),q(e.note||'')].join(',')).join('\n');
}
$('exportCsv').onclick=()=>deliver(`rands-${ym(view)}.csv`,toCsv(monthItems(view)),'text/csv');
$('exportAll').onclick=()=>deliver(`rands-all-${iso(new Date())}.csv`,toCsv(state.expenses),'text/csv');
$('backup').onclick=()=>deliver(`rands-backup-${iso(new Date())}.json`,JSON.stringify(state,null,1),'application/json');
$('restoreBtn').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.expenses)) throw 0;
    if(!await ask(`Replace current data with ${d.expenses.length} expenses from this backup?`,'Restore')) return;
    state={expenses:d.expenses,budget:d.budget||0,lastCat:d.lastCat};persist();render();hide();toast('Backup restored');
  }catch(err){toast('That file isn’t a Rands backup');}
  e.target.value='';
};
$('wipe').onclick=async()=>{if(!await ask('Erase ALL expenses and settings on this phone? This cannot be undone.','Erase'))return;
  state={expenses:[],budget:0};persist();render();hide();toast('All data erased');};

// ---------- install hint + offline ----------
const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)) $('installHint').hidden=false;
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
</body>
</html>
